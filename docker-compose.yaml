
name: Text Validator LLM

services:
  text-validator-llm:
    build: "."
    restart: "unless-stopped" # Keep running unless manually stopped
    command: "npm run start"
    ports:
        - "667:667"
    environment:
      - "HOST=0.0.0.0"
      - "PORT=667"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Preserve host access to local machine
    dns:
      - "8.8.8.8" # Fix windows issue
    env_file:
      - ".env"
